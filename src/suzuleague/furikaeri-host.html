<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#111827">
<title>スズリーグ 司会者画面（部門対抗）</title>
<!--
  部門対抗モード（振り返り会 2026-12-03）の司会者画面。司会のスマホで進行を操作する。
  host.html（高専祭本番の司会者画面）は、部門対抗モードの状態が届くとこのページに切り替わる。
  合言葉（HOST_TOKEN）は host.html と同じ保存場所を使う。
  元ファイルは src/suzuleague/furikaeri-host.html。設計は docs/furikaeri/design.md の「司会者画面」。
-->
<style>
  :root {
    --bg: #f3f4f6; --card: #ffffff; --text: #111827; --muted: #6b7280; --line: #e5e7eb;
    --accent: #2563eb; --accent-text: #ffffff; --ok: #15803d; --ng: #b91c1c; --warn: #b45309; --pink: #db2777;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b1020; --card: #161c2e; --text: #f3f4f6; --muted: #9ca3af; --line: #263049;
      --accent: #3b82f6; --ok: #4ade80; --ng: #f87171; --warn: #fbbf24; --pink: #f472b6;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
    font-size: 16px; line-height: 1.5; -webkit-text-size-adjust: 100%;
    padding: 0 14px calc(24px + env(safe-area-inset-bottom)); max-width: 560px; margin: 0 auto;
  }
  header { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 12px 0 4px; }
  header h1 { font-size: 15px; margin: 0; color: var(--muted); font-weight: 600; }
  .pill { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; white-space: nowrap; flex: none; padding: 4px 10px; border-radius: 999px; background: var(--card); border: 1px solid var(--line); }
  .pill .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .pill[data-kind="ok"] .dot { background: var(--ok); }
  .pill[data-kind="ng"] .dot { background: var(--ng); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; margin: 10px 0; }
  .label { font-size: 12px; color: var(--muted); letter-spacing: .04em; }
  .state { font-size: 22px; font-weight: 800; }
  .hidden { display: none !important; }
  .muted { color: var(--muted); }
  .question { font-size: 17px; font-weight: 700; margin-top: 4px; }
  .correct-btn {
    margin-top: 8px; width: 100%; min-height: 44px; border-radius: 10px; border: 1px dashed var(--line);
    background: none; color: var(--muted); font-size: 15px; font-weight: 700;
  }
  .correct-btn.on { color: var(--pink); font-size: 22px; border-style: solid; }
  .next {
    width: 100%; min-height: 72px; border: 0; border-radius: 16px; background: var(--accent);
    color: var(--accent-text); font-size: 21px; font-weight: 800; margin-top: 4px; touch-action: manipulation;
  }
  .next:disabled { opacity: .45; }
  .sub-btn {
    width: 100%; min-height: 48px; border-radius: 12px; border: 1px solid var(--warn);
    background: none; color: var(--warn); font-size: 16px; font-weight: 800; margin-top: 8px;
  }
  .toast { min-height: 22px; margin: 6px 2px 0; font-size: 14px; font-weight: 700; }
  .toast[data-kind="ok"] { color: var(--ok); }
  .toast[data-kind="ng"] { color: var(--ng); }
  .missing { color: var(--warn); font-weight: 700; font-size: 14px; margin-top: 4px; }
  table { width: 100%; border-collapse: collapse; }
  td { padding: 8px 2px; border-top: 1px solid var(--line); vertical-align: middle; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  td.code { font-family: ui-monospace, Menlo, monospace; color: var(--muted); }
  tr.off td { color: var(--muted); text-decoration: line-through; }
  tr.out td.name { color: var(--muted); }
  .yes { color: var(--ok); font-weight: 800; }
  .no { color: var(--warn); font-weight: 800; }
  .toggle { min-width: 72px; min-height: 36px; border-radius: 99px; border: 1px solid var(--line); background: var(--bg); color: var(--text); font-weight: 700; }
  .toggle.on { background: var(--ok); color: #fff; border-color: var(--ok); }
  .proxy { display: grid; grid-template-columns: 1fr 90px 90px; gap: 8px; margin-top: 8px; }
  .proxy select, .proxy input, .proxy button { min-height: 46px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--text); font-size: 17px; padding: 0 8px; }
  .proxy button { background: var(--accent); color: var(--accent-text); border: 0; font-weight: 800; }
  details summary { cursor: pointer; font-weight: 700; }
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: flex; align-items: center; justify-content: center; padding: 16px; }
  .overlay form { background: var(--card); border-radius: 14px; padding: 18px; width: 100%; max-width: 380px; }
  .overlay input { width: 100%; min-height: 50px; font-size: 20px; margin: 10px 0; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--text); padding: 0 10px; }
  .overlay button { width: 100%; min-height: 48px; border: 0; border-radius: 10px; background: var(--accent); color: #fff; font-size: 17px; font-weight: 800; }
</style>
</head>
<body>
<header>
  <h1>スズリーグ 司会者画面（部門対抗）<span id="rehearsal" class="hidden">【リハーサル】</span></h1>
  <span id="conn" class="pill"><span class="dot"></span><span id="conn-text">接続中…</span></span>
</header>

<div class="card">
  <div class="label" id="round">開始前</div>
  <div class="state" id="state">—</div>
  <div id="q-wrap" class="hidden">
    <div id="question" class="question"></div>
    <button id="correct-btn" class="correct-btn" type="button">押しているあいだ正解を表示</button>
  </div>
  <div id="missing" class="missing hidden"></div>
</div>

<button id="next-btn" class="next" disabled>次へ</button>
<button id="close-btn" class="sub-btn hidden" type="button">未回答のまま締め切る</button>
<div id="toast" class="toast"></div>

<div class="card">
  <div class="label" id="teams-label">部門</div>
  <table><tbody id="teams"></tbody></table>
</div>

<div id="proxy-card" class="card hidden">
  <div class="label">代理入力（部門から口頭で聞いた予想を入れる）</div>
  <div class="proxy">
    <select id="proxy-team"></select>
    <input id="proxy-value" type="number" inputmode="numeric" min="0" max="100" placeholder="%">
    <button id="proxy-btn" type="button">入力</button>
  </div>
</div>

<details class="card" id="codes-card">
  <summary>部門の合言葉（カードを忘れたとき）</summary>
  <table><tbody id="codes"></tbody></table>
</details>

<div id="token-overlay" class="overlay hidden">
  <form id="token-form">
    <div style="font-weight:800">司会者画面の合言葉</div>
    <input id="token-input" type="password" autocomplete="current-password">
    <button type="submit">開く</button>
  </form>
</div>

<script>
(function () {
  "use strict";

  var POLL_MS = 1000;
  var STALE_SEC = 6;
  var PENDING_TIMEOUT_MS = 8000;
  var TOKEN_KEY = "suzuleague-host-token";   // host.html と同じ
  var STATE = { IDLE: 0, QUESTION: 2, ANSWERING: 3, REVEAL: 4, ROUND_RESULT: 5, FINISHED: 8, OPEN: 9 };

  var el = function (id) { return document.getElementById(id); };
  var current = null, pending = null, stale = false, lastShownSeq = null, token = "";
  try { token = localStorage.getItem(TOKEN_KEY) || ""; } catch (e) { /* 保存できない環境 */ }

  function headers(json) {
    var h = {};
    if (token) h["X-Host-Token"] = token;
    if (json) h["Content-Type"] = "application/json";
    return h;
  }
  function setConn(kind, text) { el("conn").setAttribute("data-kind", kind); el("conn-text").textContent = text; }
  function toast(kind, text) { var t = el("toast"); t.setAttribute("data-kind", kind || ""); t.textContent = text || ""; }
  function show(id, v) { el(id).classList.toggle("hidden", !v); }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  el("token-form").addEventListener("submit", function (ev) {
    ev.preventDefault();
    token = el("token-input").value.trim();
    try { localStorage.setItem(TOKEN_KEY, token); } catch (e) { /* 保存できない環境 */ }
    show("token-overlay", false); toast("", ""); poll();
  });

  function poll() {
    fetch("api/host/state", { headers: headers(false), cache: "no-store" })
      .then(function (res) {
        if (res.status === 401) { show("token-overlay", true); toast("ng", token ? "合言葉が違います" : ""); throw null; }
        if (res.status === 503) { setConn("ng", "サーバの設定が未完了"); throw null; }
        if (!res.ok) throw new Error("HTTP " + res.status);
        return res.json();
      })
      .then(function (data) {
        if (!data.state) { setConn("ng", "PCがまだつながっていません"); render(null); return; }
        if (data.state.mode !== "battle") { location.replace("host.html"); return; }
        stale = data.age > STALE_SEC;
        if (stale) setConn("ng", "PCの応答なし（" + Math.round(data.age) + "秒）");
        else setConn("ok", "PCと接続中");
        render(data.state);
      })
      .catch(function (err) { if (err) setConn("ng", "サーバにつながりません"); });
  }

  // ---- 描画 ------------------------------------------------------------

  function render(s) {
    current = s;
    if (!s) { el("state").textContent = "—"; updateButtons(); return; }
    show("rehearsal", s.rehearsal);
    el("round").textContent = s.round ? "第" + s.round + "問 / " + s.rounds : "開始前（全" + s.rounds + "問）";
    el("state").textContent = s.state_label;
    show("q-wrap", !!s.question);
    if (s.question) el("question").textContent = s.question.text;
    var miss = s.missing || [];
    show("missing", miss.length > 0);
    el("missing").textContent = "まだ答えていない：" + miss.join("、");
    show("close-btn", s.state === STATE.ANSWERING && miss.length > 0);
    show("proxy-card", s.state === STATE.ANSWERING);

    renderTeams(s);
    renderCodes(s);
    renderProxyOptions(s);
    if (s.last_command && s.last_command.seq !== lastShownSeq) {
      lastShownSeq = s.last_command.seq;
      toast(s.last_command.ok ? "ok" : "ng", s.last_command.message);
    }
    if (pending && s.last_command && s.last_command.seq >= pending.seq) pending = null;
    updateButtons();
  }

  function renderTeams(s) {
    var idle = s.state === STATE.IDLE;
    var answering = s.state === STATE.ANSWERING;
    el("teams-label").textContent = idle ? "参加する部門（来ていない部門は「不参加」に）" : (answering ? "回答状況" : "順位");
    var teams = s.teams.slice();
    if (!idle && !answering) {
      teams = teams.filter(function (t) { return t.active; });
      teams.sort(function (a, b) { return (a.rank - b.rank) || (a.number - b.number); });
    }
    el("teams").innerHTML = teams.map(function (t) {
      if (idle) {
        return '<tr class="' + (t.active ? "" : "off") + '"><td class="name">' + esc(t.name) + '</td><td class="num">' +
          '<button class="toggle ' + (t.active ? "on" : "") + '" data-team="' + t.number + '" data-active="' + (t.active ? 0 : 1) + '">' +
          (t.active ? "参加" : "不参加") + "</button></td></tr>";
      }
      if (!t.active) return "";
      var cls = t.eliminated ? "out" : "";
      if (answering) {
        var mark = t.answered ? '<span class="yes">' + t.answer + "%</span>" : (t.eliminated ? '<span class="muted">脱落</span>' : '<span class="no">まだ</span>');
        return '<tr class="' + cls + '"><td class="name">' + esc(t.name) + '</td><td class="num">' + mark + '</td><td class="num">' + t.balloons + "</td></tr>";
      }
      var extra = (t.answer !== null && t.answer !== undefined) ? t.answer + "%" : "";
      if (t.damage !== null && t.damage !== undefined) extra += "（−" + t.damage + "）";
      return '<tr class="' + cls + '"><td class="num">' + (t.rank || "") + '位</td><td class="name">' + esc(t.name) +
        (t.eliminated ? "（脱落）" : "") + '</td><td class="num muted">' + extra + '</td><td class="num">' + t.balloons + "</td></tr>";
    }).join("");
  }

  function renderCodes(s) {
    el("codes").innerHTML = s.teams.map(function (t) {
      return '<tr class="' + (t.active ? "" : "off") + '"><td>' + esc(t.name) + '</td><td class="num code">' + esc(t.code || "") + "</td></tr>";
    }).join("");
  }

  function renderProxyOptions(s) {
    var sel = el("proxy-team"), keep = sel.value;
    var opts = s.teams.filter(function (t) { return t.active; }).map(function (t) {
      return '<option value="' + t.number + '">' + esc(t.name) + "</option>";
    }).join("");
    if (sel.dataset.opts !== opts) { sel.innerHTML = opts; sel.dataset.opts = opts; if (keep) sel.value = keep; }
  }

  function updateButtons() {
    var s = current, btn = el("next-btn");
    if (pending && Date.now() - pending.at > PENDING_TIMEOUT_MS) pending = null;
    var label = s && s.next_action ? s.next_action : "（終わりました）";
    if (s && s.hold > 0) label = "演出中…（あと" + s.hold + "秒）";
    btn.textContent = pending ? "送信中…" : label;
    btn.disabled = !s || !s.next_action || !!pending || stale || s.hold > 0;
  }

  // ---- 操作 ------------------------------------------------------------

  function send(command) {
    command.client_id = Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
    pending = { seq: Infinity, at: Date.now() };
    updateButtons();
    fetch("api/host/command", { method: "POST", headers: headers(true), body: JSON.stringify(command) })
      .then(function (res) { if (!res.ok) throw new Error("HTTP " + res.status); return res.json(); })
      .then(function (data) {
        pending = { seq: data.seq, at: Date.now() };
        if (data.result) { lastShownSeq = data.seq; toast(data.result.ok ? "ok" : "ng", data.result.message); pending = null; poll(); }
      })
      .catch(function (err) { pending = null; toast("ng", "送れませんでした（" + err.message + "）"); updateButtons(); });
  }

  el("next-btn").addEventListener("click", function () {
    if (!current) return;
    send({ type: "next", expect_state: current.state });
  });
  el("close-btn").addEventListener("click", function () {
    if (!current) return;
    var miss = (current.missing || []).join("、");
    if (!confirm(miss + " が未回答です。予想50として締め切りますか？")) return;
    send({ type: "close", expect_state: current.state });
  });
  el("teams").addEventListener("click", function (ev) {
    var b = ev.target.closest && ev.target.closest("button.toggle");
    if (!b) return;
    send({ type: "set_active", team: Number(b.dataset.team), active: b.dataset.active === "1" });
  });
  el("proxy-btn").addEventListener("click", function () {
    var v = el("proxy-value").value.trim();
    if (!/^\d{1,3}$/.test(v) || Number(v) > 100) { toast("ng", "0〜100の数字を入れてください"); return; }
    send({ type: "answer", team: Number(el("proxy-team").value), value: Number(v) });
    el("proxy-value").value = "";
  });

  var correctBtn = el("correct-btn");
  function correctOn(ev) {
    ev.preventDefault();
    if (current && current.question) { correctBtn.textContent = "正解 " + current.question.correct + "%"; correctBtn.classList.add("on"); }
  }
  function correctOff() { correctBtn.textContent = "押しているあいだ正解を表示"; correctBtn.classList.remove("on"); }
  correctBtn.addEventListener("pointerdown", correctOn);
  ["pointerup", "pointerleave", "pointercancel"].forEach(function (t) { correctBtn.addEventListener(t, correctOff); });
  correctBtn.addEventListener("contextmenu", function (ev) { ev.preventDefault(); });

  poll();
  setInterval(poll, POLL_MS);
  setInterval(updateButtons, 500);
})();
</script>
</body>
</html>
